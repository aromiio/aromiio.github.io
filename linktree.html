<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5026241125: Recreate Linktree Amuse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    .page {
      background-color: #b5161e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-top: 30px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background-color: #e73737;
      background-image:
        radial-gradient(white 12%, transparent 5%),
        radial-gradient(white 12%, transparent 5%);
      background-size: 34px 34px;
      background-position: 0 0, 18px 18px;
      border-radius: 18px;
    }

    .icon {
      width: 28px;
      height: 28px;
      background: rgb(246, 192, 192);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon img {
      width: 50%;
      height: auto;
    }

    .logo {
      width: 70px;
      height: auto;
      object-fit: cover;
      border-radius: 50px;
    }

    .top-section {
      border-radius: 20px;
      overflow: hidden;
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .top-section:hover {
      text-decoration: none;
      color: inherit;
    }

    .photo-grid {
      border-radius: 20px;
      height: 230px;
      overflow: hidden;
    }

    .photo-grid img {
      height: 100%;
      width: 100%;
      object-fit: cover;
    }

    .link-section {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: white;
      border-radius: 25px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .link-section.with-photo {
      justify-content: center;
    }

    .link-section:hover {
      text-decoration: none;
      color: inherit;
      background-color: #f0e9e9;
    }

    .link-title {
      font-size: 12px;
      font-weight: 500;
      text-align: center;
    }

    .dot-menu {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #656769;
      font-size: 12px;
    }

    .photo-link {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      position: absolute;
      left: 8px;
    }

    .social {
      width: 23px;
      height: 23px;
      object-fit: contain;
    }

    .footer {
      font-size: 8px;
    }

    .footer a{
      color: black
    }
  </style>

</head>

<body>
  <main class="page">
    <div class="container shadow-lg p-3">

      <!--HEADER-->
      <div class="header">

        <div class="top_icon d-flex justify-content-between align-items-center">
          <a href="#" class="icon shadow">
            <img src="assets/img/linktree/linktree_icon.png" alt="linktree">
          </a>
          <a href="#" class="icon shadow">
            <img src="assets/img/linktree/share_icon.png" alt="share">
          </a>
        </div>

        <div class="profile text-center p-3">
          <a href="https://linktr.ee/amusemakeup"><img src="assets/img/linktree/amuse.png" class="logo"></a>
          <h6>@amuse_official</h6>
        </div>

      </div>


      <!--TOP LINKS-->
      <a href="#" class="top-section bg-white p-2 shadow-sm">

        <!-- Grid Image -->
        <div class="photo-grid">
          <div class="row no-gutters">
            <div class="col-6 pr-1">
              <img src="assets/img/linktree/wonyoung2.jpg">
            </div>

            <div class="col-6 pl-1">
              <div class="row no-gutters">

                <div class="col-6 pr-1 pb-1">
                  <img src="assets/img/linktree/product2.jpg">
                </div>

                <div class="col-6 pl-1 pb-1">
                  <img src="assets/img/linktree/product5.jpg">
                </div>

                <div class="col-6 pr-1 pt-1">
                  <img src="assets/img/linktree/product3.jpg">
                </div>

                <div class="col-6 pl-1 pt-1">
                  <img src="assets/img/linktree/product6.jpg">
                </div>

              </div>
            </div>
          </div>
        </div>

        <!-- Text bawah -->
        <div class="link-section p-2">
          <p class="link-title mb-0">IN 올리브영 / 어뮤즈 X 몬치치</p>
          <span class="dot-menu"><b>⋮</b></span>
        </div>
      </a>


      <!--5 SECTION LINKS-->
      <div class="links mt-3">
        <p class="link-title mt-3"><b>AMUSE WELLNESS</b></p>
        <a href="#" class="link-section p-3 shadow-sm">
          <p class="link-title mb-0">AMUSE WELLNESS 💙</p>
          <span class="dot-menu"><b>⋮</b></span>
        </a>

        <p class="link-title mt-3"><b>STOCKIST</b></p>

        <a href="#" class="link-section p-3 shadow-sm">
          <p class="link-title mb-0">[TIKTOK] AMUSE TikTok SHOP OPEN! 💖</p>
          <span class="dot-menu"><b>⋮</b></span>
        </a>

        <a href="#" class="link-section with-photo p-3 mt-3 shadow-sm">
          <img src="assets/img/linktree/amuse.png" class="photo-link">
          <p class="link-title mb-0">AMUSE GLOBAL CHANNEL</p>
          <span class="dot-menu"><b>⋮</b></span>
        </a>

        <a href="#" class="link-section with-photo p-3 mt-3 shadow-sm">
          <img src="assets/img/linktree/amuse.png" class="photo-link">
          <p class="link-title mb-0">AMUSE GLOBAL Shipping Website ✈️</p>
          <span class="dot-menu"><b>⋮</b></span>
        </a>

        <p class="link-title mt-3"><b>and more...</b></p>

        <a href="#" class="link-section with-photo p-3 mt-3 shadow-sm">
          <img src="assets/img/linktree/wonyoung1.jpg" class="photo-link">
          <p class="link-title mb-0">🎵 AMUSE Christmas Playlist - playlist by AMUSE</p>
          <span class="dot-menu"><b>⋮</b></span>
        </a>

      </div>


      <!--BOTTOM-->
      <div class="bottom text-center mt-4">
        <div class="d-flex justify-content-center align-items-center">
          <a href="#"><img src="assets/img/linktree/insta_logo.png" class="social mx-2"></a>
          <a href="#"><img src="assets/img/linktree/tiktok_logo.png" class="social mx-2"></a>
          <a href="#"><img src="assets/img/linktree/x_logo.png" class="social mx-2"></a>
        </div>
        <div class="footer mt-5">
          <a href="#">Cookie Preferences</a> ·
          <a href="#">Report</a> ·
          <a href="#">Privacy</a> ·
          <a href="#">Explore</a>
        </div>
      </div>


    </div>
  </main>
</body>
