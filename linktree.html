<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Linktree - Amuse</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #a7342e;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }

    .wrapper {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 22px 16px 30px;
      border-radius: 28px;
      background:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 5px, transparent 6px),
        #d94d43;
      background-size: 42px 42px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .profile {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 95px;
      height: 95px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #ecd4cc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24 px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .username {
      font-size: 20 px;
      font-weight: 700;
      margin: 0;
    }

    .hero-card {
      background: #f7f7f7;
      border-radius: 28px;
      padding: 14px;
      margin-bottom: 22px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.08);
    }

    .hero-banner {
      height: 220px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff6f61, #d83d35);
      position: relative;
      overflow: hidden;
      color: white;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: end;
    }

    .hero-banner::before {
      content: "AMUSE × Monchhichi";
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .hero-banner::after {
      content: "상품 PICK";
      position: absolute;
      top: 16px;
      right: 16px;
      background: #f4ea57;
      color: #923221;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .hero-title {
      position: relative;
      z-index: 2;
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .hero-subtitle {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: 0.92rem;
      opacity: 0.95;
    }

    .hero-footer {
      text-align: center;
      padding-top: 12px;
    }

    .hero-footer h5 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .hero-footer p {
      margin: 4px 0 0;
      color: #888;
      font-size: 0.9rem;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 72px;
      margin-bottom: 16px;
      padding: 14px 48px 14px 18px;
      background: rgba(255,255,255,0.96);
      border-radius: 999px;
      color: #222;
      text-decoration: none;
      font-size: 1.02rem;
      font-weight: 500;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      transition: 0.2s ease;
    }

    .link-item:hover {
      transform: translateY(-2px);
      color: #222;
    }

    .dots {
      position: absolute;
      right: 18px;
      color: #777;
      font-size: 1rem;
    }

    @media (max-width: 480px) {
      .username {
        font-size: 1.7rem;
      }

      .hero-banner {
        height: 190px;
      }

      .link-item {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="profile">
      <div class="logo">AMUSE</div>
      <h1 class="username">@amuse_official</h1>
    </div>

    <div class="hero-card">
      <div class="hero-banner">
        <div class="hero-title">Limited Edition Collab</div>
        <p class="hero-subtitle">Innisfree / Amuse × Monchhichi</p>
      </div>
      <div class="hero-footer">
        <h5>IN올리브영 / 어뮤즈X몬치치</h5>
        <p>5 items</p>
      </div>
    </div>

    <a href="#" class="link-item">
      [공식몰] 어뮤즈X몬치치 콜라보 🤎
      <span class="dots"><i class="fa-solid fa-ellipsis-vertical"></i></span>
    </a>

    <a href="#" class="link-item">
      AMUSE WELLNESS 💙
    </a>
    <a href="#" class="link-item">
      [TIKTOK] AMUSE TikTok SHOP OPEN! 🤎
    </a>
    <a href="#" class="link-item">
      AMUSE GLOBAL CHANNEL
    </a>
    <a href="#" class="link-item">
      AMUSE GLOBAL Shipping Website 
    </a>
